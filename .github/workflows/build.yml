name: Build Minimal Keyboard

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The binary gradle-wrapper.jar cannot be produced in every environment.
      # If it is not committed, generate it here so ./gradlew always works in CI.
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "gradle-wrapper.jar not found - generating wrapper with Gradle 8.9"
            tmp="$(mktemp -d)"
            touch "$tmp/settings.gradle"
            (cd "$tmp" && gradle wrapper --gradle-version 8.9 --no-daemon)
            mkdir -p gradle/wrapper
            cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            cp "$tmp/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
            cp "$tmp/gradlew" gradlew
            cp "$tmp/gradlew.bat" gradlew.bat
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        id: build
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload debug APK
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Minimal-Keyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
