name: Build Minimal Keyboard

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Finds the Gradle project wherever it was uploaded (repo root, a sub-folder, or an
      # un-extracted .zip) and exports its folder as PROJECT_DIR for the steps below.
      - name: Locate project
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -not -path './.git/*' -not -path './.git' | sort | head -100
          find_settings() {
            find . -name settings.gradle.kts -not -path './.git/*' -not -path '*/build/*' \
              | awk -F/ '{print NF, $0}' | sort -n | head -1 | cut -d' ' -f2-
          }
          settings="$(find_settings)"
          if [ -z "$settings" ]; then
            zip="$(find . -maxdepth 3 -name '*.zip' -not -path './.git/*' | head -1)"
            if [ -n "$zip" ]; then
              echo "No project files found - extracting $zip"
              mkdir -p _project
              unzip -oq "$zip" -d _project
              settings="$(find_settings)"
            fi
          fi
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle.kts was not found anywhere in this repository. Upload the project files (app/, settings.gradle.kts, ...) to the repo."
            exit 1
          fi
          dir="$(dirname "$settings")"
          echo "Project directory: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The binary gradle-wrapper.jar cannot be bundled in every environment.
      # If it (or its properties file) is missing, generate it so ./gradlew always works in CI.
      - name: Ensure Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Wrapper files missing - generating wrapper with Gradle 8.9"
            tmp="$(mktemp -d)"
            touch "$tmp/settings.gradle"
            (cd "$tmp" && gradle wrapper --gradle-version 8.9 --no-daemon)
            mkdir -p gradle/wrapper
            cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            cp "$tmp/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
            cp "$tmp/gradlew" gradlew
            cp "$tmp/gradlew.bat" gradlew.bat
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload debug APK
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Minimal-Keyboard-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore
